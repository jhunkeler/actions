name: Install HSTCAL

description: |
  Installs HSTCAL

inputs:
  git_repository:
    description: git repository
    required: true
    default: "spacetelescope/hstcal"

  git_ref:
    description: git branch / ref
    required: false
    default: ""

  prefix:
    description: HSTCAL installation prefix
    required: false
    default: "${{ github.workspace }}/.local"

  build_type:
    description: |
      Type of build:
        Release, RelWithDebInfo, Debug, or MinSizeRel
    required: false
    default: "RelWithDebInfo"

  cmake_opts:
    description: Additional CMake arguments
    required: false
    default: ""

  make_opts:
    description: Additional Make arguments
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout HSTCAL source
      run: |
        git clone https://github.com/${{ inputs.git_repository }} ${{ github.workspace}}/hstcal
        (cd ${{ github.workspace }}/hstcal && git checkout ${{ inputs.git_ref }})
      shell: bash

    - id: git_ref
      run: echo ref=$(git describe) >> $GITHUB_OUTPUT
      working-directory: ${{ github.workspace}}/hstcal
      shell: bash
    
    - name: Install HSTCAL dependencies
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt update
            sudo apt install -y \
                cmake \
                libcfitsio-dev \
                pkg-config
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew update
            brew install \
                cmake
                cfitsio
                pkg-config
        fi
      shell: bash

    - name: Restore previous build
      id: is-built-already
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/hstcal/build/
        key: hstcal-${{ runner.os }}-${{ runner.arch }}-${{ steps.git_ref.outputs.ref }}
    
    - if: steps.is-built-already.outputs.cache-hit != 'true'
      name: Clear previous build
      run: |
        rm -rf ${{ github.workspace }}/hstcal/build/
        mkdir -p ${{ github.workspace }}/hstcal/build/
      shell: bash
    
    - if: steps.is-built-already.outputs.cache-hit != 'true'
      name: Build HSTCAL
      run: |
        make_opts="${{ inputs.make_opts }}"
        cmake_opts="${{ inputs.cmake_opts }}"
        cmake .. \
            -DCMAKE_INSTALL_PREFIX="${{ inputs.prefix }}" \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            ${cmake_opts}
        make ${make_opts}
      shell: bash
      working-directory: ${{ github.workspace }}/hstcal/build/

    - name: Install HSTCAL
      id: install-hstcal
      run: |
        make install
        echo "installdir=${{ inputs.prefix }}" >> $GITHUB_OUTPUT
        echo "bindir=${{ inputs.prefix }}/bin" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ${{ github.workspace }}/hstcal/build/

    - if: steps.is-built-already.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ github.workspace }}/hstcal/build/
        key: hstcal-${{ runner.os }}-${{ runner.arch }}-${{ steps.git_ref.outputs.ref }}

    - run: rm -rf ${{ github.workspace }}/hstcal/
      shell: bash

outputs:
  installdir:
    description: HSTCAL installation directory
    value: ${{ steps.install-hstcal.outputs.installdir }}

  bindir:
    description: HSTCAL bin directory
    value: ${{ steps.install-hstcal.outputs.bindir }}
